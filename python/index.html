<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel-2:#fbfbf9;
  --ink:#21242a; --ink-soft:#3b4149; --muted:#616a75;
  --line:#e4e4de; --line-strong:#d1d1c9; --chip:#eceee9;
  --ok:#2d6a4b; --ok-bg:#eaf5ee; --ok-line:#b9dbc5;
  --bad:#9d3b3b; --bad-bg:#fbeceb; --bad-line:#eec7c2;
  --focus:#1f6feb;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 6px 18px rgba(20,22,26,.05);
  /* the five areas */
  --a-found:#2f5fa8;  --a-found-bg:#e9eff8;
  --a-data:#1f7a66;   --a-data-bg:#e6f3ef;
  --a-cond:#9a6212;   --a-cond-bg:#f8f0e2;
  --a-loop:#6a4aa8;   --a-loop-bg:#efebf8;
  --a-comp:#a23e67;   --a-comp-bg:#fbeaf1;
  /* code colours */
  --c-kw:#9a3fa8; --c-str:#1f7a4d; --c-num:#b2591a; --c-com:#78828d; --c-fn:#2f5fa8;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#14161a; --panel:#1c1f25; --panel-2:#22262d;
  --ink:#e9ebee; --ink-soft:#d2d6dc; --muted:#a3abb7;
  --line:#2b3039; --line-strong:#3b424d; --chip:#252a32;
  --ok:#7fc79c; --ok-bg:#192a21; --ok-line:#305340;
  --bad:#e79a93; --bad-bg:#2c1c1b; --bad-line:#5a3430;
  --focus:#79a9ff;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  --a-found:#8fb3e8; --a-found-bg:#1b2434;
  --a-data:#6fc3aa;  --a-data-bg:#152a26;
  --a-cond:#e0b06a;  --a-cond-bg:#2c2416;
  --a-loop:#ac97e4;  --a-loop-bg:#231f33;
  --a-comp:#e493b4;  --a-comp-bg:#2e1c25;
  --c-kw:#d79ae8; --c-str:#86cfa4; --c-num:#e2a470; --c-com:#8a939e; --c-fn:#8fb3e8;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.6; -webkit-text-size-adjust:100%;
}
h1,h2,h3{line-height:1.3;margin:0 0 .45em}
h1{font-size:1.3rem;font-weight:650}
h2{font-size:1.15rem;font-weight:650}
h3{font-size:1rem;font-weight:650}
p{margin:0 0 .85em}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 72px}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.tiny{font-size:.84rem}
.hidden{display:none !important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}

header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
}
.topbar{max-width:780px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar h1{margin:0;font-size:1.05rem}
.topbar .sub{font-size:.78rem;color:var(--muted);line-height:1.2;display:block}
.spacer{flex:1}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.card.plain{box-shadow:none;background:transparent;border:0;padding:0}
.btn{
  appearance:none;font:inherit;font-weight:600;cursor:pointer;
  background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);
  border-radius:11px;padding:11px 16px;min-height:46px;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- home ---------- */
.areahead{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.areadot{width:12px;height:12px;border-radius:50%;flex:none}
.areahead h2{margin:0;font-size:1rem;letter-spacing:.02em}
.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px}
.topiccard{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow);
}
.topiccard:hover{border-color:var(--line-strong)}
.topiccard .tname{flex:1;min-width:0}
.topiccard .tname b{display:block;font-weight:650;font-size:.97rem}
.topiccard .tname span{display:block;font-size:.8rem;color:var(--muted)}
.ring{width:42px;height:42px;flex:none}
.ring text{font-size:11px;font-weight:700;fill:var(--ink)}

/* ---------- setup ---------- */
.optrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{
  appearance:none;font:inherit;font-size:.94rem;font-weight:600;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--line-strong);color:var(--ink);
  border-radius:999px;padding:8px 15px;min-height:42px;
}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fieldlab{display:block;font-size:.88rem;font-weight:650;color:var(--muted);margin:18px 0 0}

/* ---------- question ---------- */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700}
.pbar{height:6px;background:var(--chip);border-radius:999px;overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .25s ease}
.qtext{font-size:1.1rem;line-height:1.55;margin:0 0 14px}
pre.code{
  background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;overflow-x:auto;margin:0 0 16px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.95rem;line-height:1.55;white-space:pre;tab-size:4;
}
.kw{color:var(--c-kw);font-weight:600} .str{color:var(--c-str)} .num{color:var(--c-num)}
.com{color:var(--c-com);font-style:italic} .fn{color:var(--c-fn)}
.answers{display:grid;gap:10px}
.ans{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:var(--panel);border:1.5px solid var(--line-strong);border-radius:12px;
  padding:14px 15px;font:inherit;font-size:1rem;cursor:pointer;color:var(--ink);min-height:54px;
}
.ans:hover:not(:disabled){border-color:var(--muted);background:var(--panel-2)}
.ans .key{
  flex:none;width:26px;height:26px;border-radius:7px;background:var(--chip);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--muted);
}
.ans .atext{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem;word-break:break-word}
.ans.prose .atext{font-family:inherit;font-size:1rem}
.ans.right{background:var(--ok-bg);border-color:var(--ok)}
.ans.right .key{background:var(--ok);color:#fff}
.ans.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ans.wrong .key{background:var(--bad);color:#fff}
.ans:disabled{cursor:default}
.fb{border-radius:12px;padding:13px 15px;margin:18px 0 0;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.no{background:var(--bad-bg);border-color:var(--bad-line)}
.fb .fbhead{font-weight:700;margin:0 0 5px}
.fb.ok .fbhead{color:var(--ok)} .fb.no .fbhead{color:var(--bad)}
.fb p{margin:0 0 .5em;color:var(--ink-soft)}
.fb p:last-child{margin-bottom:0}
.fb code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.93em;background:var(--chip);padding:1px 5px;border-radius:5px}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- results ---------- */
.scoreline{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.scoreline .big{font-size:2.3rem;font-weight:700;line-height:1}
.trow{display:grid;grid-template-columns:1fr 58px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tbar{height:7px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:5px}
.tbar i{display:block;height:100%;border-radius:999px}
.tv{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.wrongitem{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0;background:var(--panel-2)}
.wrongitem .wq{font-weight:600;margin:0 0 7px}
.confirm{background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:12px;padding:14px;margin-top:12px}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 14px 60px}
  .card{padding:15px}
  .topicgrid{grid-template-columns:1fr}
  pre.code{font-size:.9rem;padding:11px 12px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div>
      <h1>Python Quiz</h1>
      <span class="sub">Data Science &middot; weeks 1&ndash;3</span>
    </div>
    <span class="spacer"></span>
    <button id="homeBtn" class="btn ghost small hidden" type="button">Home</button>
  </div>
</header>
<main class="wrap">
  <section id="screen-home"></section>
  <section id="screen-setup" class="hidden"></section>
  <section id="screen-quiz" class="hidden"></section>
  <section id="screen-results" class="hidden"></section>
</main>
<script>
/* ============================================================================
   === QUESTION BANK START ===
   Every question is one object. To add questions later, paste more objects
   into this array and re-run check_questions.py. Nothing below this block
   needs changing.

     id                unique, e.g. "loops-07"
     area              Foundations | Data structures | Conditions | Loops | Comprehensions
     topic             must match a topic listed in TOPICS further down
     angle             concept | predict | bug | choose | error | structure | logic
     difficulty        1 easy, 2 medium, 3 harder
     question          the wording shown above the code
     code              optional snippet, "\n" between lines, 4 spaces to indent
     options           exactly 4
     answer            index 0-3 of the right one
     explanation       1-3 short sentences on why it is right
     wrongExplanations 4 entries, "" in the answer's slot, one line for each other
     expect            optional: exact text the snippet prints (checked by running it)
     setup             optional: code run before `code` in the checker only
     stdin             optional: what is typed at input(), for the checker
     expectError       optional: the error the snippet should raise, e.g. "TypeError"
   ============================================================================ */
const QUESTIONS = [
 {
  "id": "print-01",
  "area": "Foundations",
  "topic": "print",
  "angle": "concept",
  "difficulty": 1,
  "question": "In the line print('Total:', 10 + 5), what are the round brackets there to do?",
  "code": "print('Total:', 10 + 5)",
  "options": [
   "They hold the arguments being passed to the function",
   "They turn the whole line into a string",
   "They multiply what is inside them",
   "They mark the line as a comment"
  ],
  "answer": 0,
  "explanation": "print is a function. The round brackets after its name hold the arguments, which are the pieces of information you are handing to it. Here there are two arguments, separated by a comma.",
  "wrongExplanations": [
   "",
   "Quotes make a string, not brackets. Only 'Total:' is a string here.",
   "Round brackets group things; the multiplying here is done by nothing at all, the + adds.",
   "A comment starts with a # and is ignored by Python."
  ]
 },
 {
  "id": "print-02",
  "area": "Foundations",
  "topic": "print",
  "angle": "predict",
  "difficulty": 1,
  "question": "What does this print?",
  "code": "print('Total:', 10 + 5)",
  "options": [
   "Total: 15",
   "Total: 10 + 5",
   "Total:15",
   "Total: , 15"
  ],
  "answer": 0,
  "expect": "Total: 15\n",
  "explanation": "Python works out 10 + 5 first and gets 15. When print is given several arguments it puts a single space between them, so you get 'Total:' then a space then 15.",
  "wrongExplanations": [
   "",
   "10 + 5 is an expression, so Python works it out rather than printing it as text.",
   "print always puts a space between arguments, so there is a gap after the colon.",
   "The comma separates the arguments; it is not printed."
  ]
 },
 {
  "id": "print-03",
  "area": "Foundations",
  "topic": "print",
  "angle": "bug",
  "difficulty": 1,
  "question": "This line will not run at all. What is wrong with it?",
  "code": "print('Name:' names[0])",
  "options": [
   "There is no comma between the two arguments",
   "names should be in quotes",
   "print should be in capitals",
   "The square brackets should be round"
  ],
  "answer": 0,
  "expectError": "SyntaxError",
  "explanation": "Arguments inside the brackets must be separated by commas. Without one, Python cannot tell where the first argument ends and gives a SyntaxError before anything runs.",
  "wrongExplanations": [
   "",
   "Putting names in quotes would print the word 'names' instead of using the list.",
   "Python is case sensitive and print is lower case; Print would be an error.",
   "Square brackets are correct for getting an item out of a list."
  ]
 },
 {
  "id": "print-04",
  "area": "Foundations",
  "topic": "print",
  "angle": "predict",
  "difficulty": 2,
  "question": "What does this print?",
  "code": "name = names[0]\nprint(f'{name} works in {depts[0]}')",
  "options": [
   "Aisha works in HR",
   "{name} works in {depts[0]}",
   "name works in depts[0]",
   "Aisha works in Finance"
  ],
  "answer": 0,
  "expect": "Aisha works in HR\n",
  "explanation": "The f before the quote makes it an f-string, so anything in curly brackets is worked out and dropped into the text. name holds 'Aisha' and depts[0] is 'HR'.",
  "wrongExplanations": [
   "",
   "That is what you get without the f at the front; here the f is present.",
   "An f-string replaces the curly brackets with values, it does not print the names of the variables.",
   "depts[0] is the first department, 'HR'. 'Finance' is depts[1]."
  ]
 },
 {
  "id": "print-05",
  "area": "Foundations",
  "topic": "print",
  "angle": "predict",
  "difficulty": 2,
  "question": "The f has been left off the front of the string. What does this print?",
  "code": "print('{names[0]} works in {depts[0]}')",
  "options": [
   "{names[0]} works in {depts[0]}",
   "Aisha works in HR",
   "names[0] works in depts[0]",
   "Nothing, it is an error"
  ],
  "answer": 0,
  "expect": "{names[0]} works in {depts[0]}\n",
  "explanation": "Without the f, it is an ordinary string and the curly brackets have no special meaning, so they are printed exactly as written. This is a common slip and Python gives no error, which makes it easy to miss.",
  "wrongExplanations": [
   "",
   "That would need f'...' with the f in front of the opening quote.",
   "The curly brackets are printed too, because the whole thing is just text.",
   "It runs perfectly happily; it just prints something you did not want."
  ]
 },
 {
  "id": "print-06",
  "area": "Foundations",
  "topic": "print",
  "angle": "bug",
  "difficulty": 2,
  "question": "This was meant to print the second person's name. What does it actually print?",
  "code": "i = 1\nprint(f'Person {1} is {names[1]}')",
  "options": [
   "Person 1 is Ben",
   "Person 1 is Aisha",
   "Person i is Ben",
   "Person {1} is Ben"
  ],
  "answer": 0,
  "expect": "Person 1 is Ben\n",
  "explanation": "The first set of curly brackets has the digit 1 in it, not the variable i. Python works out the expression 1, which is just 1, so it prints the number rather than the value of i. Here they happen to look the same, which is why this bug can hide for a long time.",
  "wrongExplanations": [
   "",
   "names[1] is 'Ben'. 'Aisha' is names[0].",
   "An f-string works out what is inside the brackets, so you never see the letter i itself.",
   "The curly brackets are replaced, not printed, because this is an f-string."
  ]
 },
 {
  "id": "print-07",
  "area": "Foundations",
  "topic": "print",
  "angle": "error",
  "difficulty": 2,
  "question": "Running a line gives: TypeError: 'builtin_function_or_method' object is not subscriptable. Which line caused it?",
  "code": "print(len[names])",
  "options": [
   "len[names] uses square brackets, but len is a function and needs round ones",
   "names has not been defined yet",
   "len cannot be used on a list",
   "print needs its arguments in square brackets"
  ],
  "answer": 0,
  "expectError": "TypeError",
  "explanation": "Square brackets mean 'get an item out of this', which is why Python complains that len cannot be indexed. Calling a function always uses round brackets: len(names).",
  "wrongExplanations": [
   "",
   "If names were missing you would get a NameError that mentions names by name.",
   "len works on lists perfectly well; it is the brackets that are wrong.",
   "print takes round brackets, like every other function call."
  ]
 },
 {
  "id": "print-08",
  "area": "Foundations",
  "topic": "print",
  "angle": "choose",
  "difficulty": 1,
  "question": "Which line prints how many people are in the team?",
  "options": [
   "print(len(names))",
   "print(len[names])",
   "print(names.len())",
   "print(count(names))"
  ],
  "answer": 0,
  "expect": "6\n",
  "explanation": "len() is a built-in function that gives the number of items in a list. You pass the list to it in round brackets, and print shows the result.",
  "wrongExplanations": [
   "",
   "Square brackets are for getting an item out of something; function calls use round brackets.",
   "len is a stand-alone function, not something a list carries, so names.len() does not exist.",
   "There is no built-in function called count. Lists have a .count() method, but it counts how many times one value appears."
  ]
 },
 {
  "id": "print-09",
  "area": "Foundations",
  "topic": "print",
  "angle": "bug",
  "difficulty": 2,
  "question": "This line will not run. Why not?",
  "code": "print('Ben's extension is 2102')",
  "options": [
   "The apostrophe in Ben's ends the string early",
   "2102 should be in quotes",
   "print cannot take an apostrophe at all",
   "There should be a comma after Ben's"
  ],
  "answer": 0,
  "expectError": "SyntaxError",
  "explanation": "The string starts at the first quote and Python treats the next single quote it meets as the end, so the apostrophe in Ben's closes it too soon. Use double quotes around the whole thing instead: \"Ben's extension is 2102\".",
  "wrongExplanations": [
   "",
   "2102 is inside the string already, so it is text like everything else.",
   "An apostrophe is fine; it just cannot be a single quote inside a single-quoted string.",
   "There is only one argument here, so there is nothing to separate."
  ]
 },
 {
  "id": "print-10",
  "area": "Foundations",
  "topic": "print",
  "angle": "structure",
  "difficulty": 2,
  "question": "In print('Years:', years[2]), which part is a literal?",
  "code": "print('Years:', years[2])",
  "options": [
   "'Years:'",
   "years",
   "years[2]",
   "print"
  ],
  "answer": 0,
  "explanation": "A literal is a value written out directly in the code. 'Years:' is written out as it is, so it is a literal. years is a variable and years[2] looks a value up, so neither is written out directly.",
  "wrongExplanations": [
   "",
   "years is a variable: a name standing for a value stored elsewhere.",
   "years[2] is an expression that Python has to work out before it can print anything.",
   "print is the name of the function being called."
  ]
 },
 {
  "id": "var-01",
  "area": "Foundations",
  "topic": "variables",
  "angle": "predict",
  "difficulty": 1,
  "question": "What does this print?",
  "code": "a = 1\na = a + 1\nprint(a)",
  "options": [
   "2",
   "1",
   "a + 1",
   "11"
  ],
  "answer": 0,
  "expect": "2\n",
  "explanation": "The second line works out the right-hand side first. a is 1, so a + 1 is 2, and that result is then stored back under the name a.",
  "wrongExplanations": [
   "",
   "The second line replaces the old value, so a is no longer 1.",
   "Python works the expression out rather than storing it as text.",
   "The + adds the numbers; it does not stick them together. That only happens with strings."
  ]
 },
 {
  "id": "var-02",
  "area": "Foundations",
  "topic": "variables",
  "angle": "concept",
  "difficulty": 1,
  "question": "What does the equals sign do in the line  hours = 10 ?",
  "options": [
   "It creates a variable called hours and stores 10 in it",
   "It checks whether hours is the same as 10",
   "It prints the value of hours",
   "It makes 10 permanent so it can never change"
  ],
  "answer": 0,
  "explanation": "A single = is an assignment: it puts a value into a name. Checking whether two things are equal is a double ==, which is a different thing entirely.",
  "wrongExplanations": [

(function(){
"use strict";

/* ---------------- storage (never allowed to break the app) ---------------- */
const KEY = "pyquiz.v1";
let memory = null;
function blank(){ return { topics:{}, wrong:[] }; }
function load(){
  if(memory) return memory;
  try {
    const raw = window.localStorage.getItem(KEY);
    if(!raw) return (memory = blank());
    const d = JSON.parse(raw);
    const base = blank();
    if(d && typeof d === "object"){
      if(d.topics && typeof d.topics === "object") base.topics = d.topics;
      if(Array.isArray(d.wrong)) base.wrong = d.wrong;
    }
    return (memory = base);
  } catch(e){ return (memory = blank()); }
}
function save(){
  try { window.localStorage.setItem(KEY, JSON.stringify(memory)); }
  catch(e){ /* storage blocked: carry on with this session only */ }
}
function topicStat(id){
  const d = load();
  if(!d.topics[id]) d.topics[id] = { seen:0, right:0, best:0 };
  return d.topics[id];
}

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function areaKey(area){
  const a = AREAS.find(x => x.name === area);
  return a ? a.key : "found";
}
function topicById(id){ return TOPICS.find(t => t.id === id); }
function topicName(id){ const t = topicById(id); return t ? t.name : id; }
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; }
  return b;
}

/* ---------------- a very small Python highlighter ----------------
   Strings and comments are found first so that keywords inside them
   are left alone. */
const KEYWORDS = ("False None True and as assert break class continue def del elif else except " +
  "finally for from global if import in is lambda nonlocal not or pass raise return try while with yield").split(" ");
const BUILTINS = ("print len range type int str float bool list tuple set dict frozenset zip enumerate " +
  "input any all sum min max sorted abs round id").split(" ");
function highlight(code){
  /* Strings and comments are taken out first, so keywords inside them are
     left alone. Everything else is then walked through once, token by token.
     One pass matters: an earlier version chained .replace() calls and the
     later ones found the markup the earlier ones had just inserted, which
     put raw class="..." text on the screen. */
  function plain(text){
    let out = "";
    const re = /([A-Za-z_][A-Za-z0-9_]*)|(\d+\.?\d*)|([\s\S])/g;
    let m;
    while((m = re.exec(text)) !== null){
      if(m[1]){
        const word = m[1];
        const follows = text.slice(re.lastIndex);
        if(KEYWORDS.indexOf(word) >= 0) out += '<span class="kw">' + word + "</span>";
        else if(BUILTINS.indexOf(word) >= 0 && /^\s*\(/.test(follows))
          out += '<span class="fn">' + word + "</span>";
        else out += word;
      } else if(m[2]){
        out += '<span class="num">' + m[2] + "</span>";
      } else {
        out += esc(m[3]);
      }
    }
    return out;
  }
  let outHTML = "";
  let rest = String(code);
  const re = /('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|#[^\n]*)/;
  let m;
  while((m = re.exec(rest)) !== null){
    outHTML += plain(rest.slice(0, m.index));
    outHTML += '<span class="' + (m[0][0] === "#" ? "com" : "str") + '">' + esc(m[0]) + "</span>";
    rest = rest.slice(m.index + m[0].length);
  }
  return outHTML + plain(rest);
}

/* ---------------- installing it as an app ----------------
   None of this is needed for the quiz to work. Opened straight from a file
   it is skipped entirely, so index.html on its own behaves exactly as before. */
let installMsg = null, deferredPrompt = null;
function isInstalled(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
         window.navigator.standalone === true;
}
function setupInstall(){
  if(isInstalled() || location.protocol === "file:") return;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();

    installMsg = "You can install this as an app: it gets its own icon, opens without the " +
                 "browser bars, and still works with no connection.";
    if(screen === "home") renderHome();
  });
  window.addEventListener("appinstalled", () => {
    deferredPrompt = null; installMsg = null;
    if(screen === "home") renderHome();
  });
  const ua = navigator.userAgent || "";
  const iOS = /iPad|iPhone|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
  if(iOS && !/CriOS|FxiOS|EdgiOS/.test(ua)){
    installMsg = "To keep this on your home screen like an app: tap the <b>Share</b> button in " +
                 "Safari, then <b>Add to Home Screen</b>.";
  }
}
function setupServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  const host = location.hostname;
  if(location.protocol !== "https:" && host !== "localhost" && host !== "127.0.0.1") return;
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });

/* ---------------- screens ---------------- */
let screen = "home";
function show(name){

  $("homeBtn").classList.toggle("hidden", name === "home");

function ring(pct, colour){
  const r = 15, c = 2*Math.PI*r, done = c * (pct/100);
  return '<svg class="ring" viewBox="0 0 40 40" aria-hidden="true">' +
    '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="var(--chip)" stroke-width="4"/>' +
    '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+colour+'" stroke-width="4" ' +
      'stroke-linecap="round" stroke-dasharray="'+done.toFixed(1)+' '+c.toFixed(1)+'" ' +
      'transform="rotate(-90 20 20)"/>' +
    '<text x="20" y="24" text-anchor="middle">'+pct+'</text></svg>';
}

function askReset(){

/* ---------------- set up ---------------- */
let setupState = { topics:[], count:10, diff:"any" };
function renderSetup(preselect){

function pool(){
  return QUESTIONS.filter(q =>
    (setupState.topics.length === 0 || setupState.topics.indexOf(q.topic) >= 0) &&
    (setupState.diff === "any" || String(q.difficulty) === setupState.diff));

/* ---------------- the quiz ---------------- */
let quiz = null;
function startQuiz(list, label){
  const picked = shuffle(list);
  const n = (setupState.count === "all" || !setupState.count) ? picked.length
            : Math.min(setupState.count, picked.length);
  quiz = {
    items: picked.slice(0, n).map(q => ({ q:q, order:shuffle([0,1,2,3]) })),
    i:0, answers:[], label: label || null
  };
  renderQuestion();
  show("quiz");
}
function startMistakes(){
  const d = load();
  const list = QUESTIONS.filter(q => d.wrong.indexOf(q.id) >= 0);
  if(!list.length) return;
  setupState = { topics:[], count:"all", diff:"any" };
  startQuiz(list, "Mistakes round");
}
function renderQuestion(){
  const it = quiz.items[quiz.i], q = it.q;
  const t = topicById(q.topic), key = areaKey(q.area);
  let html = '<div class="card fade"><div class="qtop">' +
    '<span class="badge" style="background:var(--a-'+key+'-bg);color:var(--a-'+key+')">' +
      esc(t ? t.name : q.topic) + '</span>' +
    '<span class="spacer"></span>' +
    '<span class="small muted">' + (quiz.label ? esc(quiz.label) + " &middot; " : "") +
      "Question " + (quiz.i+1) + " of " + quiz.items.length + "</span></div>";
  html += '<div class="pbar"><i style="width:' + (quiz.i/quiz.items.length*100) + '%"></i></div>';
  html += '<p class="qtext">' + esc(q.question) + "</p>";
  if(q.code) html += '<pre class="code">' + highlight(q.code) + "</pre>";
  html += '<div class="answers" id="answers">';
  it.order.forEach((orig, slot) => {
    const text = q.options[orig];
    const prose = /[a-z]{4,}\s[a-z]{4,}/.test(text) && !/[=\[\](){}]/.test(text);
    html += '<button class="ans' + (prose ? " prose" : "") + '" data-orig="'+orig+'" data-slot="'+slot+'">' +
            '<span class="key">' + "ABCD"[slot] + '</span><span class="atext">' + esc(text) + "</span></button>";
  });
  html += "</div><div id=\"fbSlot\"></div></div>";
  $("screen-quiz").innerHTML = html;
  document.querySelectorAll("#answers .ans").forEach(b => {
    b.onclick = () => answer(parseInt(b.getAttribute("data-orig"),10));
  });
}
function answer(orig){
  const it = quiz.items[quiz.i], q = it.q;
  if(it.given !== undefined) return;
  it.given = orig;
  const right = orig === q.answer;
  quiz.answers.push({ id:q.id, topic:q.topic, right:right });

  const st = topicStat(q.topic);
  st.seen++; if(right) st.right++;
  const d = load();
  const at = d.wrong.indexOf(q.id);
  if(right){ if(at >= 0) d.wrong.splice(at,1); }
  else if(at < 0) d.wrong.push(q.id);
  save();

  document.querySelectorAll("#answers .ans").forEach(b => {
    const o = parseInt(b.getAttribute("data-orig"),10);
    b.disabled = true;
    if(o === q.answer) b.classList.add("right");
    else if(o === orig) b.classList.add("wrong");
  });
  let html = '<div class="fb ' + (right ? "ok" : "no") + '"><p class="fbhead">' +
             (right ? "Correct" : "Not quite") + "</p>";
  if(!right){
    const w = (q.wrongExplanations || [])[orig];
    if(w) html += "<p>" + esc(w) + "</p>";
  }
  html += "<p>" + esc(q.explanation) + "</p></div>";
  const last = quiz.i + 1 >= quiz.items.length;
  html += '<div class="row" style="margin-top:16px"><button class="btn primary" id="nextBtn">' +
          (last ? "See results" : "Next") + "</button></div>";
  $("fbSlot").innerHTML = html;
  $("nextBtn").focus();
  $("nextBtn").onclick = next;
}
function next(){
  if(quiz.i + 1 >= quiz.items.length) return renderResults();
  quiz.i++;
  renderQuestion();
}

/* ---------------- results ---------------- */
function renderResults(){
  const total = quiz.answers.length;
  const right = quiz.answers.filter(a => a.right).length;
  const pct = total ? Math.round(right/total*100) : 0;
  const byTopic = {};
  quiz.answers.forEach(a => {
    if(!byTopic[a.topic]) byTopic[a.topic] = { n:0, c:0 };
    byTopic[a.topic].n++; if(a.right) byTopic[a.topic].c++;
  });
  Object.keys(byTopic).forEach(t => {
    const st = topicStat(t);
    const p = Math.round(byTopic[t].c / byTopic[t].n * 100);
    if(p > (st.best||0)) st.best = p;
  });
  save();

  let msg;
  if(pct === 100) msg = "Every one right. Worth trying a harder difficulty next.";
  else if(pct >= 80) msg = "Strong. The few you missed are the ones worth re-reading.";
  else if(pct >= 60) msg = "A good base. The explanations below are where the value is.";
  else if(pct >= 40) msg = "Plenty to build on. Try the mistakes round in a day or two.";
  else msg = "Early days, and that is exactly what this is for. Read the explanations, then try again.";

  let html = '<div class="card"><h2>Results</h2>' +
    '<div class="scoreline"><span class="big">' + right + "/" + total + '</span>' +
    '<span class="muted">' + pct + "%</span></div><p class=\"muted\">" + msg + "</p>";
  html += '<h3 style="margin-top:22px">By topic</h3><div>';
  Object.keys(byTopic).forEach(t => {
    const o = byTopic[t], p = Math.round(o.c/o.n*100);
    const tt = topicById(t), col = "var(--a-" + areaKey(tt ? tt.area : "") + ")";
    html += '<div class="trow"><div><div style="font-weight:600">' + esc(topicName(t)) + "</div>" +
            '<div class="tbar"><i style="width:'+p+'%;background:'+col+'"></i></div></div>' +
            '<div class="tv">' + o.c + "/" + o.n + "</div></div>";
  });
  html += "</div>";

  const missed = quiz.items.filter(it => it.given !== undefined && it.given !== it.q.answer);
  if(missed.length){
    html += '<h3 style="margin-top:24px">What to look at again</h3>';
    missed.forEach(it => {
      const q = it.q;
      html += '<div class="wrongitem"><p class="wq">' + esc(q.question) + "</p>";
      if(q.code) html += '<pre class="code">' + highlight(q.code) + "</pre>";
      html += '<p class="small" style="margin:0 0 6px"><b>Answer:</b> <code>' + esc(q.options[q.answer]) + "</code></p>";
      html += '<p class="small muted" style="margin:0">' + esc(q.explanation) + "</p></div>";
    });
  }
  html += '<div class="row" style="margin-top:22px">';
  if(missed.length) html += '<button class="btn primary" id="retryBtn">Retry these mistakes</button>';
  html += '<button class="btn" id="newBtn">New quiz</button>' +
          '<button class="btn ghost" id="homeBtn2">Home</button></div></div>';
  $("screen-results").innerHTML = html;
  const rb = $("retryBtn");
  if(rb) rb.onclick = () => {
    setupState = { topics:[], count:"all", diff:"any" };
    startQuiz(missed.map(it => it.q), "Mistakes round");
  };
  $("newBtn").onclick = () => renderSetup(null);
  $("homeBtn2").onclick = () => { renderHome(); show("home"); };
  show("results");
}

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "Escape"){ renderHome(); show("home"); return; }
  if(screen !== "quiz") return;
  const it = quiz && quiz.items[quiz.i];
  if(!it) return;
  if(e.key === "Enter"){
    const nb = $("nextBtn");
    if(nb){ e.preventDefault(); next(); }
    return;
  }
  let slot = -1;
  if(/^[1-4]$/.test(e.key)) slot = parseInt(e.key,10) - 1;
  else if(/^[a-dA-D]$/.test(e.key)) slot = "abcd".indexOf(e.key.toLowerCase());
  if(slot >= 0 && it.given === undefined){
    e.preventDefault();
    answer(it.order[slot]);
  }
});

setupInstall();
setupServiceWorker();
$("homeBtn").onclick = () => { renderHome(); show("home"); };
renderHome();
show("home");
})();
</script>
